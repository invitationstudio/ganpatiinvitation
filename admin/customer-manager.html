<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Manager</title>

<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">

<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="manager">

    <header class="managerHeader">

        <h1>Ganpati Customer Manager</h1>

        <button id="newCustomerBtn">
            ➕ New Customer
        </button>

    </header>

    <div class="searchBox">

        <input
            type="text"
            id="searchCustomer"
            placeholder="Search Customer...">

    </div>

    <div id="customerList">

        <div class="customerCard">

            <h3>Demo Customer</h3>

            <p>demo.json</p>

            <div class="actions">

                <button>📋 Copy Link</button>

                <button>✏ Edit</button>

                <button>🗑 Delete</button>

            </div>

        </div>

    </div>

</div>

<script>

async function loadCustomers(){

    const response = await fetch("../data/customers.json?"+Date.now());

    const customers = await response.json();

    const list = document.getElementById("customerList");

    list.innerHTML = "";

    customers.forEach(customer=>{

        list.innerHTML += `

        <div class="customerCard">

            <h3>${customer.family}</h3>

            <p>${customer.id}.json</p>

            <div class="actions">

                <button onclick="copyLink('${customer.id}')">
                    📋 Copy Link
                </button>

                <button onclick="editCustomer('${customer.id}')">
    🚀 Open
</button>
                <button onclick="deleteCustomer('${customer.id}')">
                    🗑 Delete
                </button>

            </div>

        </div>

        `;

    });

}

function copyLink(id){

    const url =
    window.location.origin +
    "/invitation.html?customer=" +
    id;

    navigator.clipboard.writeText(url);

    alert("Link Copied");

}

function editCustomer(id){

    window.location.href =
    "customer-dashboard.html?customer=" + id;

}

function deleteCustomer(id){

    alert("Delete : " + id);

}

document.getElementById("searchCustomer").addEventListener("input", function () {

    const keyword = this.value.toLowerCase();

    const cards = document.querySelectorAll(".customerCard");

    cards.forEach(card => {

        const text = card.innerText.toLowerCase();

        if (text.includes(keyword)) {

            card.style.display = "";

        } else {

            card.style.display = "none";

        }

    });

});

loadCustomers();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{

background:#111;

padding:25px;

font-family:Poppins,sans-serif;

}

.container{

max-width:500px;

margin:auto;

}

input{

width:100%;

padding:15px;

margin-bottom:15px;

border:none;

border-radius:12px;

font-size:16px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:12px;

background:#FFD700;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

</style>

<meta name="robots" content="noindex, nofollow">

</head>

<body>

<div class="container">

<input id="family" placeholder="Family Name">

<input id="date" placeholder="Date">

<input id="time" placeholder="Time">

<input id="address" placeholder="Address">

<input id="phone" placeholder="Phone">

<input id="title" placeholder="Invitation Title">

<input id="whatsapp" placeholder="WhatsApp">

<input id="map" placeholder="Google Map Link">

<button id="saveBtn">

Save

</button>

</div>

<script src="js/admin.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Aarti Manager</title>

<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="aartiPage">


    <div class="aartiContainer">


        <h2 id="customerInfo">
            Loading...
        </h2>


        <div class="aartiHeader">

            <h1>
                🙏 Aarti Manager
            </h1>

        </div>



        <div class="aartiForm">


            <label>
                Aarti Name
            </label>


            <input
            type="text"
            id="aartiName"
            placeholder="Enter Aarti Name">



            <label>
                Select MP3
            </label>


            <input
            type="file"
            id="aartiFile"
            accept="audio/*">



            <button
            id="uploadAartiBtn"
            class="primaryBtn">

                ⬆ Upload Aarti

            </button>


        </div>




        <div class="uploadedBox">


            <h2>
                🎵 Uploaded Aarti
            </h2>

            <div class="searchBox">

    <input
        type="text"
        id="searchAarti"
        placeholder="🔍 Search Aarti...">

</div>


            <div id="aartiList">


            </div>


        </div>



        <button
        id="backBtn"
        class="logoutBtn">

            ⬅ Back

        </button>



    </div>


</div>


<script type="module" src="admin-back.js"></script>

<script type="module" src="aarti-manager.js"></script>


</body>

</html>

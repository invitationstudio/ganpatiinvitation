<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Theme Manager</title>

<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">

<link rel="stylesheet" href="admin.css">

</head>


<body>



<div class="themePage">



<div class="themeContainer">





<h2 id="customerInfo">
Loading...
</h2>




<div class="themeHeader">


<h1>
🎨 Theme Manager
</h1>


</div>







<div class="themeUploadBox">



<h2>
🖼 Upload Theme Image
</h2>




<input
type="file"
id="themeImage"
accept="image/*">





<button
id="uploadThemeBtn"
class="primaryBtn">

☁ Upload Theme

</button>



</div>







<div class="themePreviewBox">



<h2>
👁 Theme Preview
</h2>




<img
id="themePreview">



</div>








<button
id="backBtn"
class="logoutBtn">

⬅ Back

</button>





</div>



</div>







<script type="module" src="admin-back.js"></script>


<script type="module" src="theme-manager.js"></script>



</body>

</html>
